name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truckops?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/truckops?schema=public

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must never depend on live credentials. Supplying
          # placeholders keeps every code path constructible while still
          # failing loudly if code starts reading a real secret at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          RESEND_API_KEY: placeholder-resend-key

  prisma:
    name: Prisma schema check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Check schema formatting
        run: npx prisma format --schema prisma/schema.prisma --check

      - name: Generate client
        run: npx prisma generate --schema prisma/schema.prisma

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a credential committed and later deleted is still
          # caught.
          fetch-depth: 0
      - name: Scan tracked files for committed credentials
        run: node scripts/scan-secrets.js

  unit:
    name: Unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: MIME parser checks
        run: npm run verify:email

      - name: Outbound email template checks
        run: npm run verify:email-send

      - name: Webhook signature checks
        run: npm run verify:webhook

      - name: Stripe signature checks
        run: npm run verify:stripe

      - name: Authentication and signup hardening checks
        run: npm run verify:auth

      - name: Demo seed safety checks
        run: npm run verify:seed-safety

      - name: Upload security checks
        run: npm run verify:upload-security

      - name: Tenant isolation regression checks
        run: npm run verify:tenant-isolation

      - name: API contract regression checks
        run: npm run verify:api-contracts

      - name: Repository database baseline checks
        run: npm run verify:database-baseline

      - name: Booking detail error checks
        run: npm run verify:booking-errors

      - name: Plan limit checks
        run: npm run verify:plans

      - name: Workflow correctness checks
        run: npm run verify:workflow
